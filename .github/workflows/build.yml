name: Build Android and Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and Windows platform projects
        run: flutter create --platforms=android,windows --project-name=grandma_pill_tracker .
      - name: Get packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run widget tests
        run: flutter test --no-pub
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-pill-tracker-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and Windows platform projects
        run: flutter create --platforms=android,windows --project-name=grandma_pill_tracker .
      - name: Get packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run widget tests
        run: flutter test --no-pub
      - name: Build Windows app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-pill-tracker-windows
          path: build/windows/x64/runner/Release/
